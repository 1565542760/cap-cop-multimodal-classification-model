[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-cop-reproducibility"
version = "0.1.0"
description = "Local CAP/COP reproducibility workspace with semantic model names."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "SimpleITK>=2.3",
  "pydicom>=3.0",
  "Pillow>=10.0",
  "timm>=0.9",
  "monai>=1.3",
  "xgboost>=2.0",
  "pyradiomics>=3.1",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "torch>=2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

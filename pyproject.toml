[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-cop-reproducibility"
version = "0.2.0"
description = "Local CAP/COP reproducibility workspace with semantic model names."
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4; python_version < '3.11'",
  "numpy==2.4.6; python_version == '3.11'",
  "numpy==2.5.3; python_version >= '3.12'",
  "pandas==2.3.3; python_version < '3.11'",
  "pandas==3.0.3; python_version == '3.11'",
  "pandas==3.0.6; python_version >= '3.12'",
  "scikit-learn==1.6.1; python_version < '3.11'",
  "scikit-learn==1.9.0; python_version == '3.11'",
  "scikit-learn==1.9.1; python_version >= '3.12'",
  "scipy==1.13.1; python_version < '3.11'",
  "scipy==1.17.1; python_version == '3.11'",
  "scipy==1.18.1; python_version >= '3.12'",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
phenotype = ["SimpleITK>=2.3", "pydicom>=3.0; python_version >= '3.10'",
             "pydicom==2.4.4; python_version < '3.10'", "Pillow>=10.0"]
radiomics = ["SimpleITK>=2.3", "pydicom>=3.0; python_version >= '3.10'",
             "pydicom==2.4.4; python_version < '3.10'", "pyradiomics>=3.1"]
clinical = ["xgboost>=2.0"]
imaging = ["SimpleITK==2.5.5", "pydicom==3.0.1; python_version >= '3.10'",
           "pydicom==2.4.4; python_version < '3.10'", "torch==2.11.0",
           "torchvision==0.26.0", "timm==1.0.30", "monai==1.6.0"]
plotting = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
